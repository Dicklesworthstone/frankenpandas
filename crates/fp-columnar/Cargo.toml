[package]
name = "fp-columnar"
description = "Columnar storage primitives (Column, ValidityMask) for pandas-parity dataframes — the storage layer behind fp-frame."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# br-frankenpandas-oxv4u: ISA-isolated dot kernel, built +avx2,+fma by a
# per-package profile entry. Entered only behind a runtime CPU guard.
fp-dot-kernel = { path = "../fp-dot-kernel" }
fp-types = { path = "../fp-types", version = "0.2.0" }
rustc-hash = "2"
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
