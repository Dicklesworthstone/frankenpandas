[package]
name = "fp-expr"
description = "Expression evaluation / query parser for fp-frame DataFrames — pandas df.eval / df.query parity."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
fp-columnar = { path = "../fp-columnar", version = "0.2.0" }
fp-frame = { path = "../fp-frame", version = "0.2.0" }
fp-index = { path = "../fp-index", version = "0.2.0" }
fp-runtime = { path = "../fp-runtime", version = "0.2.0" }
fp-types = { path = "../fp-types", version = "0.2.0" }
serde = { workspace = true }
thiserror = { workspace = true }

# br-frankenpandas-qm012. Test-only: the A/B harness self-reports the SHA-256 of
# the executing test ELF, because the fleet has measured the same cell 3x apart
# on two workers and a row that cannot name its binary is not comparable to any
# other row. fp-runtime's sha256_hex is private, and this is a dev-dependency, so
# nothing is added to the shipped crate.
[dev-dependencies]
sha2 = "0.11.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
