# br-frankenpandas-oxv4u: `profile-rustflags` lets ONE crate carry
# `-Ctarget-feature=+avx2,+fma` while the rest of the workspace stays at the
# baseline target. It is cargo-UNSTABLE, so this pins the workspace to nightly
# cargo — already the case via rust-toolchain.toml, but now load-bearing rather
# than incidental. Adopted with the maintainer's explicit go-ahead.
cargo-features = ["profile-rustflags"]

[workspace]
resolver = "2"
members = [
  "crates/fp-types",
  "crates/fp-columnar",
  "crates/fp-dot-kernel",
  "crates/fp-frame",
  "crates/fp-index",
  "crates/fp-expr",
  "crates/fp-groupby",
  "crates/fp-join",
  "crates/fp-io",
  "crates/fp-conformance",
  "crates/fp-bench",
  "crates/fp-runtime",
  "crates/fp-frankentui",
  "crates/fp-python",
  "crates/frankenpandas",
]

[workspace.package]
edition = "2024"
version = "0.2.0"
# The LICENSE file is MIT plus a non-MIT rider on AI-assistant usage, which is
# not expressible as a standard SPDX expression. The file itself is therefore the
# license of record; no `license = "MIT"` SPDX field is set (it would understate
# the rider, and cargo flags it as redundant alongside `license-file`).
license-file = "LICENSE"
authors = ["Jeffrey Emanuel <jeff141421@gmail.com>"]
repository = "https://github.com/Dicklesworthstone/frankenpandas"
homepage = "https://github.com/Dicklesworthstone/frankenpandas"
documentation = "https://docs.rs/frankenpandas"
readme = "README.md"
keywords = ["dataframe", "pandas", "analytics", "columnar", "rust"]
categories = ["data-structures", "science"]

[workspace.dependencies]
arrow = { version = "59.0.0", default-features = false, features = ["prettyprint", "ipc"] }
bumpalo = { version = "3.20.3", features = ["collections"] }
bytes = "1.11.1"
calamine = "0.36.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
dta = "0.6.0"
fast-float2 = "0.2.3"
hdf5 = { package = "hdf5-metno", version = "0.12.4" }
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "snap"] }
mysql = "28.0"
mimalloc = "0.1"
# `extension-module` is DELIBERATELY NOT ENABLED HERE — it is opt-in via
# `fp-python`'s own `extension-module` feature. The flag tells PyO3 to omit
# libpython linkage, which is correct for a wheel loaded INTO a Python process
# and fatal for `cargo test`: every fp-python test binary failed to link with
# `undefined symbol: PyGILState_Ensure` and friends, so the whole crate's suite
# was dark. br-frankenpandas-r18qs, CrimsonPine 2026-08-17.
pyo3 = { version = "0.29" }
quick-xml = "0.41"
regex = "1.12.3"
rust_xlsxwriter = "0.97.0"
rusqlite = { version = "0.40.1", features = ["bundled", "column_decltype"] }
ryu = "1.0.23"
sas7bdat = "0.2.0"
sas_xport = "0.4.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-pickle = "1.2.0"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.19"
# tracing: optional observability layer per br-frankenpandas-7gd4.
# Downstream crates add `tracing = { workspace = true, optional = true }`
# and gate it behind their own `tracing` feature so users who don't opt
# in pay no dependency cost.
tracing = { version = "0.1.41", default-features = false }
ucd = "0.1.1"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"

# br-frankenpandas-oxv4u: the ONLY ISA-elevated crate in the workspace.
#
# A blanket x86-64-v3 policy was MEASURED and REJECTED (2026-07-31 CyanLynx:
# sqrt 0.361x, log regressed), so the flag is scoped to the one kernel that
# benefits. sqrt/log live in fp-columnar and are deliberately NOT covered here —
# that isolation is the entire reason fp-dot-kernel is a separate crate.
#
# Applied to BOTH release profiles on purpose: benchmarks build `release-perf`,
# so flagging only `release` would leave every measured row at baseline ISA and
# the lever would read as inert.
# USER-DIRECTED 2026-08-19, after this project became the volume's dominant writer
# twice in one session: `target/` reached 100 GB against under 110 GB for the other
# EIGHT projects combined, `/data` fell 227G -> 143G in three ticks, and the host hit
# iowait 76% at loadavg 238.
#
# THE CAUSE WAS FULL DWARF IN THE DEV PROFILE, not the number of builds. Cargo's dev
# default is `debug = true`, and this workspace carries 622 examples (fp-frame 385,
# fp-columnar 151, fp-index 45, fp-join 41) plus per-crate test binaries. Every
# `cargo clippy/test --all-targets` links each one at ~170 MB, so
# `target/debug/examples` alone measured 57 GB across 5883 files. Reclaiming it with
# `cargo clean -p` took `target/` from 100 GB to 13 GB, which is the size of the
# problem.
#
# Line tables keep what is actually used here: panic backtraces still carry file and
# line, and `perf` still resolves symbols and source lines. What is given up is
# variable inspection in a debugger, which no gate in this repo performs.
#
# ⚠️ IF YOU NEED FULL DEBUG INFO, do it in your own invocation
# (`RUSTFLAGS=-Cdebuginfo=2 cargo test -p <crate>`) rather than by raising this — a
# workspace-wide flip re-links every example on the volume.
[profile.dev]
debug = "line-tables-only"

[profile.release.package.fp-dot-kernel]
rustflags = ["-Ctarget-feature=+avx2,+fma"]

[profile.release-perf]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false
opt-level = 3

# Package rustflags are NOT inherited through `inherits = "release"`, so
# release-perf needs its OWN entry. Without this, every benchmark row would build
# the kernel at baseline ISA while the release profile carried the flag — the
# lever would read as inert in exactly the measurements meant to certify it.
[profile.release-perf.package.fp-dot-kernel]
rustflags = ["-Ctarget-feature=+avx2,+fma"]

# br-frankenpandas-3qpj4: THE LEVER IS A PAIR — the cfg(target_feature = "sse4.1")
# arm in floor_fast/ceil_fast/trunc_fast is DEAD without this flag, and the flag
# buys those ops almost nothing without the arm. Verified inert before adding this:
# the baseline fp-columnar rlib contains ZERO rounding instructions, so `f64::floor`
# never lowered to `roundsd` anywhere in the crate.
#
# ⚠️ +sse4.1 ONLY, deliberately NOT x86-64-v3. The v3 experiment was measured and
# REJECTED (CyanLynx 2026-07-31: sqrt 0.361x, log regressed) — but that policy turns
# on AVX/AVX2 width, which is what changed those kernels. sse4.1 adds rounding and
# blend instructions; `sqrt` lowers to SSE2 `sqrtpd` either way and `log` is a libm
# call in both. The narrower flag is chosen so the rejected collateral cannot recur,
# and the claim is checkable in object code rather than argued.
[profile.release.package.fp-columnar]
rustflags = ["-Ctarget-feature=+sse4.1"]

[profile.release-perf.package.fp-columnar]
rustflags = ["-Ctarget-feature=+sse4.1"]
