name: Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Wheels Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY
      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # The manylinux containers do not see setup-python's interpreter: without
      # --find-interpreter the x86_64 leg built only the image's default cp39
      # wheel and the aarch64 cross image found no interpreter at all. The
      # manylinux2014 aarch64 cross gcc rejects libmimalloc-sys's
      # -Werror=date-time ("no option -Wdate-time"), so that leg builds on
      # manylinux_2_28. (0zz8y.3)
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter --manifest-path crates/fp-python/Cargo.toml
          sccache: 'true'
          manylinux: ${{ matrix.target == 'aarch64' && '2_28' || 'auto' }}
      # Only the leg whose wheel this runner can import (aarch64 is cross-built).
      # Fails on a wrong __version__ or an empty read_csv. (0zz8y.3)
      - name: Smoke-test the wheel
        if: matrix.target == 'x86_64'
        shell: bash
        run: |
          export EXPECTED_VERSION="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          python -m pip install --no-index --find-links dist frankenpandas
          python scripts/wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  macos:
    name: Wheels macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY
      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          target: ${{ matrix.target == 'aarch64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/fp-python/Cargo.toml
          sccache: 'true'
      # macos-latest runs on arm64: only the aarch64 wheel is importable here.
      - name: Smoke-test the wheel
        if: matrix.target == 'aarch64'
        shell: bash
        run: |
          export EXPECTED_VERSION="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          python -m pip install --no-index --find-links dist frankenpandas
          python scripts/wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist/*.whl

  windows:
    name: Wheels Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY
      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/fp-python/Cargo.toml
          sccache: 'true'
      - name: Smoke-test the wheel
        shell: bash
        run: |
          export EXPECTED_VERSION="$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")"
          python -m pip install --no-index --find-links dist frankenpandas
          python scripts/wheel_smoke.py
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/fp-python/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    name: Release to PyPI / TestPyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'"
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        if: env.MATURIN_PYPI_TOKEN != ''
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
