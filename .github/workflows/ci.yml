name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # br-frankenpandas-edn3q: periodically catch workspace-wide test rot
    # that crate-scoped swarm validation can miss.
    #
    # br-frankenpandas-ey5sl: PUSH TRIGGER REMOVED BY USER RULING 2026-08-22
    # ("Scheduled batch CI"). Measured cause: agents push to main at a
    # ~2.7-minute median while this six-job workflow needs far longer, so the
    # single pending slot of the concurrency group below was superseded by the
    # next push almost every time — 0 green runs in 1,200 attempts back to
    # 2026-07-13, and runs queued >28h under load. Per-commit full-matrix runs
    # would burn minutes ~15x faster than they complete; a fixed batch keeps
    # continuous enforcement with bounded cost. The 2026-08-23 batch took
    # 13.7 hours wall-clock, so a three-hour cadence can never drain its
    # concurrency slot: GitHub replaces the one pending run on every tick
    # before it creates jobs. Daily leaves enough room for a delayed batch to
    # start and finish. PRs still trigger immediately.
    - cron: "23 3 * * *"

concurrency:
  # Scheduled batches intentionally share one slot, but an operator's
  # workflow_dispatch must not sit behind that slot's replaceable pending run.
  # Give manual runs their immutable run id so a real verification run always
  # reaches the job queue; PRs retain their usual one-slot cancellation group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly + rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: rustfmt

      - name: Format check
        run: cargo fmt --check

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features:
          - ""                        # default features
          - "--no-default-features"   # minimum-viable build
          - "--all-features"          # every feature on (asupersync etc.)
        include:
          # Windows: single default-feature build surfacing path /
          # newline / toolchain regressions without the full 3x feature
          # fan-out. Per br-frankenpandas-0l5r incremental step 2: add
          # windows `cargo check` coverage before committing to full
          # IO-suite on that runner.
          - os: windows-latest
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly + clippy/rust-src)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          components: clippy, rust-src

      - name: Install HDF5 (all-features leg)
        # ey5sl triage of run 32393665943: both `--all-features` lint legs
        # failed in hdf5-metno-sys's build script — "Unable to locate HDF5
        # root directory and/or headers" — because the `hdf5` feature needs
        # the system library, which GitHub runners do not ship. Install the
        # runner-native package instead of dropping the coverage.
        if: matrix.features == '--all-features'
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libhdf5-dev pkg-config
          elif command -v brew >/dev/null 2>&1; then
            brew install hdf5
          else
            echo "No known package manager on this runner; failing closed" >&2
            exit 1
          fi

      - name: Check
        run: cargo check --all-targets ${{ matrix.features }}

      - name: Clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

      - name: Rustdoc
        if: matrix.features == '--all-features'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      TMPDIR: ${{ github.workspace }}/.tmp
      FP_PYTHON_BIN: .venv-oracle/bin/python
      FP_REQUIRE_LIVE_ORACLE: "1"
      FP_ALLOW_SYSTEM_PANDAS_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create temp dirs
        run: mkdir -p .tmp .target

      - name: Install and verify required pandas oracle
        run: |
          python -m venv .venv-oracle
          "$FP_PYTHON_BIN" -m pip install --upgrade pip -r crates/fp-conformance/oracle/requirements.txt
          test -x "$FP_PYTHON_BIN" || { echo "required live pandas oracle interpreter is missing: $FP_PYTHON_BIN" >&2; exit 1; }
          "$FP_PYTHON_BIN" -c 'import pandas; print(f"live pandas oracle {pandas.__version__}")'

      - name: Workspace tests (--no-fail-fast)
        # br-frankenpandas-edn3q: keep collecting failures across all
        # workspace targets so stray examples and stale integration tests
        # are visible in a single gate run.
        run: cargo test --workspace --no-fail-fast

      - name: Doctest (--doc)
        # Per br-frankenpandas-ddox: `cargo test --workspace` does NOT
        # execute doctests by default. Run them explicitly so the 8
        # (growing) doctests across frankenpandas / fp-index / fp-columnar
        # stay exercised on every PR and don't rot into broken docs.rs
        # builds at release time.
        # br-frankenpandas-n35k2: --doc is one target PER CRATE, so without
        # --no-fail-fast a single crate's broken doctest hides every later
        # crate's. Same target-ordering defect as the conformance job below.
        run: cargo test --doc --workspace --no-fail-fast

  core-test:
    # br-frankenpandas-ey5sl: this is the smallest independent correctness
    # gate for the two core execution crates. It deliberately has no `needs`
    # and no `continue-on-error`: a red fp-frame or fp-columnar suite must
    # fail the workflow even when another broad workspace job is already red.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Core fp-frame and fp-columnar tests
        run: cargo test -p fp-frame -p fp-columnar --no-fail-fast

  eager-frame:
    # br-frankenpandas-it6kj: the default build uses lazy transpose storage,
    # so exercise the non-default eager store separately before it silently
    # drifts out of type and behavior coverage.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-eager-frame
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Eager fp-frame tests
        # br-frankenpandas-n35k2: deliberately NO --no-fail-fast here. `--lib`
        # selects exactly one target, and that flag only governs whether cargo
        # continues to the NEXT target, so it would be a no-op. The flag belongs
        # on the multi-target invocations (:148 workspace, :159 --doc, :287
        # fp-conformance), not on every cargo test line.
        run: cargo test -p fp-frame --lib --no-default-features

  conformance:
    runs-on: ubuntu-latest
    # br-frankenpandas-ey5sl scope item 3: deliberately NO `needs: [test]`.
    # Chaining the parity check behind the full workspace suite meant any
    # unrelated red test silently disabled pandas-parity verification — the
    # conformance job was SKIPPED, not failed, for the entire outage, so the
    # gate read green-adjacent while verifying nothing. The parity signal must
    # be independent of test-suite health; both jobs now start in parallel.
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-conformance
      TMPDIR: ${{ github.workspace }}/.tmp
      FP_PYTHON_BIN: .venv-oracle/bin/python
      FP_REQUIRE_LIVE_ORACLE: "1"
      FP_ALLOW_SYSTEM_PANDAS_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      # br-frankenpandas-kcwat: on 2026-09-01 this job died inside the
      # toolchain action's rustup download (curl network error) before the
      # oracle pytest suite or the perf gate ran, while every other job's
      # identical step succeeded. One retry turns a transient into a non-event
      # without hiding a real toolchain failure (the second attempt still
      # fails the job).
      - name: Setup Rust (pinned nightly)
        id: rust_setup
        continue-on-error: true
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Setup Rust (pinned nightly, retry after transient failure)
        if: steps.rust_setup.outcome == 'failure'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create temp dirs
        run: mkdir -p .tmp .target-conformance

      - name: Install and verify required pandas oracle
        run: |
          python -m venv .venv-oracle
          "$FP_PYTHON_BIN" -m pip install --upgrade pip -r crates/fp-conformance/oracle/requirements-dev.txt
          test -x "$FP_PYTHON_BIN" || { echo "required live pandas oracle interpreter is missing: $FP_PYTHON_BIN" >&2; exit 1; }
          "$FP_PYTHON_BIN" -c 'import pandas; print(f"live pandas oracle {pandas.__version__}")'

      - name: Oracle pytest suite
        # Per br-frankenpandas-urhy: the 4985-LOC pandas_oracle.py is the
        # conformance spec's "source of truth". Running its pytest suite
        # before the cargo conformance tests catches oracle-side
        # normalize_* / dispatch regressions that would otherwise silently
        # corrupt every generated fixture.
        run: python -m pytest crates/fp-conformance/oracle/tests/ -v

      - name: Perf ratchet gate self-tests
        # Per br-frankenpandas-a9fh8 and br-frankenpandas-s7x8z: the ratchet in
        # scripts/apply_ratchet.sh gates on perf_ratchet.py's exit code, and two
        # defects reached main inside it — the latency thresholds were inverted
        # (a 50% slowdown returned ALLOW, a 50% speedup returned BLOCK), and it
        # compared a candidate against a baseline from a different worker. Both
        # are pure-Python and need no benchmark run, so they are cheap to hold.
        run: python -m pytest scripts/tests/ -v

      # br-frankenpandas-fixture-corpus-stale-vs-oracle-p6srr: REPORT-ONLY, and
      # deliberately so until the corpus is repaired.
      #
      # This step is hard-failing today (1257/1258 fixtures pin a stale
      # oracle_script_sha256, across 11 distinct oracle generations). Because it
      # ran BEFORE "Conformance tests" in the same job, its failure aborted the
      # job and the conformance suite NEVER RAN. A hard gate that masks the
      # suite entirely means the suite cannot fail, and a gate that cannot fail
      # is not a gate — dark coverage is the worse risk.
      #
      # continue-on-error keeps the staleness VISIBLE in the run (the step still
      # goes red and still prints every offending fixture) while letting the
      # conformance suite below actually execute. This is NOT a relaxation of
      # what the check asserts: check_fixture_freshness.sh is untouched, and it
      # returns to gating the moment p6srr's repair lands.
      - name: Fixture freshness (report-only until p6srr)
        continue-on-error: true
        run: ./scripts/check_fixture_freshness.sh

      - name: Conformance tests (--no-fail-fast)
        # br-frankenpandas-n35k2: WITHOUT --no-fail-fast this stops at the first
        # failing TARGET, and fp-conformance has several. The lib target has
        # been red for the whole campaign (FP-P2D-056), and
        # tests/proptest_properties.rs runs after it — so 419 property tests
        # never executed here. They became visible only when the lib happened to
        # go green, and the moment cargo reached the binary it found two real
        # failures (a Null-condition divergence in fp-frame's where/mask typed
        # fast path, fixed at 293a74e58). A genuine correctness defect stayed
        # invisible for the entire campaign purely because of target ordering.
        #
        # This is the SAME defect as the `continue-on-error` note above, one
        # level down: there a failing STEP masked the suite, here a failing
        # TARGET masks the later targets. Both hide reds, and the fix in both
        # cases makes the gate strictly stricter rather than looser.
        run: cargo test -p fp-conformance --no-fail-fast -- --nocapture

      - name: Performance regression gate
        # br-frankenpandas-n35k2: --test names ONE target, so target ordering
        # cannot hide anything here and --no-fail-fast would be a no-op. It does
        # NOT change which failures get reported — libtest already runs every
        # test in a binary and reports them all. Reporting every failing baseline
        # is libtest's default, not something this flag buys.
        #
        # This exact command string is pinned by fp-conformance's
        # ci_supply_chain_policy::ci_workflow_runs_perf_regression_gate_instead_of_noop_bench.
        # Change it there in the same commit or that test goes red.
        run: cargo test -p fp-conformance --test perf_baselines -- --nocapture --ignored --skip perf_run_all_baselines

  gates:
    runs-on: ubuntu-latest
    needs: [conformance]
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-gates
      TMPDIR: ${{ github.workspace }}/.tmp
      FP_PYTHON_BIN: .venv-oracle/bin/python
      FP_REQUIRE_LIVE_ORACLE: "1"
      FP_ALLOW_SYSTEM_PANDAS_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Create temp dirs
        run: mkdir -p .tmp .target-gates

      - name: Install and verify required pandas oracle
        run: |
          python -m venv .venv-oracle
          "$FP_PYTHON_BIN" -m pip install --upgrade pip -r crates/fp-conformance/oracle/requirements.txt
          test -x "$FP_PYTHON_BIN" || { echo "required live pandas oracle interpreter is missing: $FP_PYTHON_BIN" >&2; exit 1; }
          "$FP_PYTHON_BIN" -c 'import pandas; print(f"live pandas oracle {pandas.__version__}")'

      - name: Phase2C gate check
        run: ./scripts/phase2c_gate_check.sh

      - name: CI gate topology (G1..G8) + forensics
        if: always()
        run: |
          mkdir -p artifacts/ci
          cargo run -p fp-conformance --bin fp-ci-gates -- \
            --pipeline full \
            --no-fail-fast \
            --no-verify-sidecars \
            --allow-system-pandas-fallback \
            --json-out artifacts/ci/gate_forensics.json

      - name: Upload gate forensics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-gate-forensics
          path: |
            artifacts/ci/gate_forensics.json
            artifacts/ci/live_oracle_report.json
          if-no-files-found: warn

      - name: Total-parity governance gate
        if: always()
        run: ./scripts/governance_gate_check.sh

      - name: Upload governance gate artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-gate-report
          path: artifacts/ci/governance_gate_report.json
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: RustSec advisory audit
        # Ignore list is mirrored in deny.toml so cargo-deny + cargo-audit
        # stay in sync. RUSTSEC-2024-0436: `paste` 1.0.15 unmaintained —
        # transitive via parquet 58.x, no direct usage. Drop once parquet
        # replaces paste.
        # RUSTSEC-2026-0173: proc-macro-error2 unmaintained, transitive via
        # hdf5-metno and mysql; no safe upgrade exists (paths in deny.toml).
        # RUSTSEC-2026-0253: lru 0.16.x UNSOUND via mysql — IGNORED BY USER
        # RULING 2026-08-22 ("Documented ignore"): no semver-compatible fix
        # (mysql still pinned 0.16.x on the ruling date), exposure is gated
        # behind the non-default sql-mysql feature, and v7ymy owns dropping
        # the ignore when upstream moves.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2026-0253

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Unused dependency audit
        run: cargo machete

  licenses:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target-deny
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: License and source policy audit
        run: cargo deny check advisories bans licenses sources

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  fuzz-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/fuzz/.target
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("rust-toolchain.toml", "rb") as fh:
              print(f"channel={tomllib.load(fh)['toolchain']['channel']}")
          PY

      - name: Setup Rust (pinned nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz regression corpus
        working-directory: fuzz
        run: |
          set -euo pipefail
          targets="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "fp-fuzz") | .targets[] | select(.kind[] == "bin") | .name')"
          for target in $targets; do
            mkdir -p "artifacts/$target"
            cargo fuzz run "$target" "corpus/$target" -- \
              -runs=1000 \
              -rss_limit_mb=512 \
              -timeout=60 \
              -artifact_prefix="artifacts/$target/"
          done

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-regression-artifacts
          path: fuzz/artifacts
          if-no-files-found: warn
